# /etc/nginx/sites-available/tablepro.app, cutover version (tablepro-cloud roadmap M18.4)
#
# Applied by hand at step 9 of the cutover (tablepro-cloud docs/design/migration.md), before this repository's
# main deploys at step 10. Until then the host runs the version in TableProApp/license,
# docs/deploy/tablepro.app.nginx.conf, which sends /account, /checkout, /webhooks, /newsletter, /beta, /discount,
# /thank-you, /api/newsletter and /platform-build to the Laravel app.
#
# Against that version: the platform location, @platform and /platform-build/assets/ are gone; /account and below,
# /checkout and /thank-you redirect to the portal; /newsletter/unsubscribe/ and /webhooks/polar reach tablepro-cloud
# for 90 days. Everything else is that file's. Compare with `sudo nginx -T` before applying, then `sudo nginx -t`.
#
# tablepro-cloud's deploy/nginx/tablepro-cloud.conf defines the tablepro_cloud upstream, and its setup installs
# /etc/nginx/snippets/cloudflare-allow.conf; both must be in place first.
#
# PLATFORM_PATHS in app/Support/Localization/LocalizedUrl.php names every path below that this app never answers.

server {
    server_name tablepro.app;

    access_log /var/log/nginx/tablepro.app-access.log;
    error_log  /var/log/nginx/tablepro.app-error.log warn;

    root /var/www/tablepro.app/public;
    index index.php index.html;

    # ---------------------------------------------------------------------
    # The retired account app's paths, permanently on account.tablepro.app.
    #
    # /account keeps its query: the site linked /account?locale=vi. A path
    # below it carried a sign-in token or a signed order in its query, which
    # means nothing to the portal, so none crosses.
    # ---------------------------------------------------------------------
    location = /account {
        return 301 https://account.tablepro.app/$is_args$args;
    }

    location ^~ /account/ {
        return 301 https://account.tablepro.app/;
    }

    # GET /checkout?plan=...&cycle=... is tablepro-cloud's hosted checkout, for old links.
    location = /checkout {
        return 301 https://account.tablepro.app/checkout$is_args$args;
    }

    location = /thank-you {
        return 301 https://account.tablepro.app/;
    }

    # ---------------------------------------------------------------------
    # For 90 days after the cutover, then removed with the old APP_KEY and
    # legacy_newsletter_links (tablepro-cloud M23.4): unsubscribe links in
    # newsletters the Laravel app sent, and Polar deliveries to the old
    # endpoint.
    #
    # proxy_pass names no URI, so the request URI passes exactly as it
    # arrived: the unsubscribe signature covers those bytes. tablepro-cloud
    # routes by Host and trusts CF-Connecting-IP only because its nginx
    # admits Cloudflare alone, so these locations do too.
    # ---------------------------------------------------------------------
    location ^~ /newsletter/unsubscribe/ {
        include /etc/nginx/snippets/cloudflare-allow.conf;

        proxy_pass http://tablepro_cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.tablepro.app;
        proxy_read_timeout 60s;
    }

    location = /webhooks/polar {
        include /etc/nginx/snippets/cloudflare-allow.conf;

        proxy_pass http://tablepro_cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.tablepro.app;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------
    # Everything else: the public site.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The public site's Vite output: a content hash in every filename, so a URL
    # never changes contents. Without this, Cloudflare applies its four-hour
    # default. Not extended to /images/: those filenames carry no hash.
    location /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cloudflare does not cache .webmanifest, so without a header every page
    # view asked the origin for it.
    location = /site.webmanifest {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/tablepro-web.sock;
    }

    location ~ /\.ht {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tablepro.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tablepro.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = tablepro.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name tablepro.app;
    listen 80;
    return 404; # managed by Certbot
}
