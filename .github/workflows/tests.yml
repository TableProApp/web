name: tests

on:
  push:
    branches:
      - main
  pull_request:

# Read-only. This repository accepts pull requests from forks, so no workflow
# here may be granted write access to the repository or to secrets.
permissions:
  contents: read

jobs:
  php:
    # Named by PHP version alone, so the check branch protection requires,
    # "php (8.5)", stays put when the matrix changes.
    name: php (${{ matrix.php-version }})
    # Production: Ubuntu 26.04, whose archive ships PHP 8.5 only.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.5"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Reads composer.lock, not vendor/, so it reports on exactly what a
      # deploy installs. Fails on a known advisory or an abandoned package.
      - name: Audit dependencies
        run: composer audit --locked

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Bundled asset catalogs are current
        run: php artisan assets:generate --check

      - name: Tests
        run: ./vendor/bin/pest

  frontend:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Node's own runner over `tests/js`, no test dependency to install. The
      # attribution module decides which source a sale is credited to and is
      # the only frontend logic here that cannot be checked by rendering a
      # page, so it is covered by execution rather than by the source-reading
      # assertions the Pest suite uses.
      - name: Frontend tests
        run: npm run test:js

      - name: Build
        run: npm run build

  # Every case behind `requireSsr()` (tests/Support/ssr.php) needs a built SSR
  # bundle and a running SSR service, and skips itself when either is missing.
  # The `php` job above provides neither, so those cases skip there. This job
  # is the one place they execute; REQUIRE_SSR turns those skips into failures
  # so they cannot go quiet again.
  ssr:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Build client and SSR bundles
        run: npm run build

      # The port is read from .env rather than repeated here: .env.example
      # already carries INERTIA_SSR_URL and INERTIA_SSR_PORT, and its own
      # comment requires the two to agree. A third copy would be a third thing
      # to keep in sync.
      - name: Start the SSR service
        run: |
          port="$(grep '^INERTIA_SSR_PORT=' .env | cut -d= -f2)"
          nohup php artisan inertia:start-ssr > /tmp/ssr.log 2>&1 &

          for _ in $(seq 1 30); do
            if (exec 3<>"/dev/tcp/127.0.0.1/${port}") 2>/dev/null; then
              exec 3<&-
              echo "SSR service listening on ${port}"
              exit 0
            fi
            sleep 1
          done

          echo "SSR service did not open port ${port} within 30s" >&2
          cat /tmp/ssr.log >&2 || true
          exit 1

      # The whole suite, not one file.
      #
      # This once ran only HomepageRenderTest.php, which left every other
      # SSR-rendered assertion skipping on every push: the `php` job above
      # builds no bundles, so every `ssrHtml()` / `requireSsr()` assertion
      # short-circuits there, and this job is the one place they execute.
      #
      # REQUIRE_SSR turns a skip into a failure, so this cannot go quiet again.
      - name: SSR render tests
        env:
          REQUIRE_SSR: 1
        run: ./vendor/bin/pest

      - name: SSR service log
        if: always()
        run: cat /tmp/ssr.log || true
