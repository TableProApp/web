name: og cards

# Manual only, and deliberately so.
#
# Regenerating cards writes to public/og, which is tracked, so this job needs
# write access. A workflow with write access must never run against code from a
# fork, which rules out `pull_request`. A maintainer runs this after merging a
# content change instead.
on:
  workflow_dispatch:
    inputs:
      type:
        description: "Which set to regenerate"
        required: true
        default: "all"
        type: choice
        options: [all, site, blog, database, compare, feature]
      locale:
        description: "Which language's cards"
        required: true
        default: "all"
        type: choice
        options: [all, en, vi]
      slug:
        description: "Single slug (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # This job holds a write token, so keep setup-node's automatic npm
          # cache off, as its README advises for such workflows.
          package-manager-cache: false

      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # The card templates embed the site's own fonts (resources/css/fonts.css)
      # from node_modules, so a card rendered here has the same Inter glyphs
      # as one rendered on a Mac, Vietnamese included.
      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: |
          npm install -g puppeteer
          npx puppeteer browsers install chrome

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # WEB_DOMAIN overrides the localhost value .env.example carries: each
      # card prints its page's canonical address.
      - name: Generate cards
        env:
          WEB_DOMAIN: tablepro.app
          OG_TYPE: ${{ inputs.type }}
          OG_LOCALE: ${{ inputs.locale }}
          OG_SLUG: ${{ inputs.slug }}
        run: |
          ARGS=(--type="$OG_TYPE" --locale="$OG_LOCALE")
          if [ -n "$OG_SLUG" ]; then ARGS+=(--slug="$OG_SLUG"); fi
          php artisan og:generate "${ARGS[@]}"

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(og): regenerate social cards"
          # public/og.png is the English generic card, written in place by --type=site.
          file_pattern: public/og/** public/og.png
