* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #ffffff;
    color: #0a0a0a;
    font-family: 'Inter Variable', sans-serif;
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
}

body {
    position: relative;
}

.lockup {
    position: absolute;
    top: 96px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
}

.lockup img {
    display: block;
    width: 88px;
    height: 88px;
}

.wordmark {
    font-size: 48px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.021em;
}

.sentence {
    position: absolute;
    left: 64px;
    right: 64px;
    top: 0;
    bottom: 0;
    margin: auto;
    height: max-content;
    font-size: 56px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.022em;
    text-align: center;
    transform: translateY(35px);
}

:lang(vi) .sentence { line-height: 1.3; }

.nobr { white-space: nowrap; display: inline-block; }

.address {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 92px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    line-height: 1;
    letter-spacing: 0;
    color: #9e5209;
}
</style>
